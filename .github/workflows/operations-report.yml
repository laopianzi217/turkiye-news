name: Unified operations report

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: unified-operations-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'laopianzi217/turkiye-news'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report script
        uses: actions/checkout@v4
      - name: Generate read-only operations report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/operations-report.sh
