name: Critical data backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/critical-data-backup.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: critical-data-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'laopianzi217/turkiye-news'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create backup archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          tar -czf critical-data-backup.tar.gz \
            src/data/news.json \
            data/content-protection.json \
            data/derivatives.json \
            data/sources.json
          sha256sum critical-data-backup.tar.gz > critical-data-backup.sha256
          echo "## 关键数据备份已生成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 仓库：\`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件：新闻数据、内容保护名单、衍生仓库清单、新闻来源配置" >> "$GITHUB_STEP_SUMMARY"
          echo "- 校验：SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "- 保留期限：90 天（若仓库策略限制更短，以仓库设置为准）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: critical-data-backup-${{ github.run_id }}
          path: |
            critical-data-backup.tar.gz
            critical-data-backup.sha256
          if-no-files-found: error
          retention-days: 90

  notify-failure:
    if: always() && needs.backup.result == 'failure' && github.repository == 'laopianzi217/turkiye-news'
    needs: [backup]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update backup failure alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 关键数据备份失败"
          body="关键数据备份工作流运行失败。请检查本次 Actions 运行记录和日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  close-recovery-alert:
    if: always() && needs.backup.result == 'success' && github.repository == 'laopianzi217/turkiye-news'
    needs: [backup]
    runs-on: ubuntu-latest
    steps:
      - name: Close backup failure alert after recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 关键数据备份失败"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "最新一次关键数据备份已成功，自动关闭此告警。"
            gh issue close "$issue"
          else
            echo "No open backup failure alert."
          fi
