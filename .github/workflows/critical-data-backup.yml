name: Critical data backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/critical-data-backup.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-data-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'laopianzi217/turkiye-news'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create backup archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          tar -czf critical-data-backup.tar.gz \
            src/data/news.json \
            data/content-protection.json \
            data/derivatives.json \
            data/sources.json
          sha256sum critical-data-backup.tar.gz > critical-data-backup.sha256
          echo "## 关键数据备份已生成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 仓库：\`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件：新闻数据、内容保护名单、衍生仓库清单、新闻来源配置" >> "$GITHUB_STEP_SUMMARY"
          echo "- 校验：SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "- 保留期限：90 天（若仓库策略限制更短，以仓库设置为准）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: critical-data-backup-${{ github.run_id }}
          path: |
            critical-data-backup.tar.gz
            critical-data-backup.sha256
          if-no-files-found: error
          retention-days: 90
