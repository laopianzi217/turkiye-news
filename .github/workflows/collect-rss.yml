name: Collect PHA lifestyle news
on:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/collect-rss.mjs'
      - '.github/workflows/collect-rss.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:
  group: rss-collection-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect PHA lifestyle news
        run: node scripts/collect-rss.mjs
      - name: Validate Basin RSS fields without publishing
        if: github.event_name == 'push'
        run: node scripts/test-basin-feed.mjs
      - name: Commit collected PHA news
        id: commit
        run: |
          if git diff --quiet -- src/data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No RSS changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          git commit -m "Update collected PHA news"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm install
      - name: Check dependency security
        if: steps.commit.outputs.changed == 'true'
        run: npm audit --audit-level=high
      - name: Build static site
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=turkiye-yasam --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
