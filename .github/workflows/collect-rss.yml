name: Collect PHA lifestyle news

on:
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/collect-rss.mjs'
      - 'scripts/test-basin-feed.mjs'
      - '.github/workflows/collect-rss.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rss-collection-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'laopianzi217/turkiye-news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect PHA and permitted brand news
        env:
          PHA_API_KEY: ${{ secrets.PHA_API_KEY }}
        run: node scripts/collect-rss.mjs
      - name: Validate Basin RSS fields without publishing
        if: github.event_name == 'push'
        run: node scripts/test-basin-feed.mjs
      - name: Commit collected news
        id: commit
        env:
          DERIVATIVE_ADMIN_TOKEN: ${{ secrets.DERIVATIVE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No RSS changes to commit."
            exit 0
          fi
          if [ -z "$DERIVATIVE_ADMIN_TOKEN" ]; then
            echo "DERIVATIVE_ADMIN_TOKEN is required to trigger the main deployment and derivative sync workflows." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          git commit -m "Update collected lifestyle news"
          git remote set-url origin "https://x-access-token:$DERIVATIVE_ADMIN_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  notify-failure:
    if: always() && needs.collect.result == 'failure' && github.repository == 'laopianzi217/turkiye-news'
    needs: [collect]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update news collection alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 新闻采集失败"
          body="新闻采集工作流运行失败。请检查本次 Actions 运行记录和日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  close-recovery-alert:
    if: always() && needs.collect.result == 'success' && github.repository == 'laopianzi217/turkiye-news'
    needs: [collect]
    runs-on: ubuntu-latest
    steps:
      - name: Close collection failure alert after recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 新闻采集失败"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "最新一次新闻采集工作流已成功，自动关闭此告警。"
            gh issue close "$issue"
          fi
