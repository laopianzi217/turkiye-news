name: Build and deploy static site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check dependency security
        run: npm audit --audit-level=high
      - name: Build static site
        run: npm run build
      - name: Ensure Cloudflare Pages project exists
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/turkiye-yasam")
          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages project already exists."
          elif [ "$status" = "404" ]; then
            npx wrangler pages project create turkiye-yasam --production-branch main
          else
            cat /tmp/pages-project.json
            echo "Could not verify Cloudflare Pages project (HTTP $status)." >&2
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=turkiye-yasam --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
