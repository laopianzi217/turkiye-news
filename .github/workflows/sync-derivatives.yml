name: Sync derivative repositories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: derivative-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'laopianzi217/turkiye-news'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read derivative repository list
        id: list
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync('data/derivatives.json', 'utf8'));
          if (!Array.isArray(entries)) throw new Error('data/derivatives.json must be a JSON array');
          const repos = entries.map(entry => typeof entry === 'string' ? entry : entry.repository);
          for (const repo of repos) {
            const parts = typeof repo === 'string' ? repo.split('/') : [];
            if (parts.length !== 2 || !parts.every(part => /^[A-Za-z0-9_.-]+$/.test(part))) {
              throw new Error(`Invalid derivative repository name: ${repo}`);
            }
          }
          fs.writeFileSync('/tmp/derivatives.txt', repos.join('\n') + (repos.length ? '\n' : ''));
          if (repos.length === 0) console.log('No derivative repositories registered yet.');
          NODE
      - name: Sync main branch to all derivatives
        env:
          DERIVATIVE_ADMIN_TOKEN: ${{ secrets.DERIVATIVE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/derivatives.txt ]; then
            echo "No derivatives to sync; skipping."
            exit 0
          fi
          if [ -z "$DERIVATIVE_ADMIN_TOKEN" ]; then
            echo "DERIVATIVE_ADMIN_TOKEN is not configured." >&2
            exit 1
          fi
          while IFS= read -r target || [ -n "$target" ]; do
            [ -z "$target" ] && continue
            echo "Syncing $target"
            git remote remove derivative 2>/dev/null || true
            git remote add derivative "https://x-access-token:$DERIVATIVE_ADMIN_TOKEN@github.com/$target.git"
            git push derivative HEAD:main --force
            git remote remove derivative
          done < /tmp/derivatives.txt

  notify-failure:
    if: always() && needs.sync.result == 'failure' && github.repository == 'laopianzi217/turkiye-news'
    needs: [sync]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update sync failure alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 衍生仓库同步失败"
          body="主仓库衍生仓库同步工作流失败。请打开本次 Actions 运行记录，检查失败的仓库和错误日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  close-recovery-alert:
    if: always() && needs.sync.result == 'success' && github.repository == 'laopianzi217/turkiye-news'
    needs: [sync]
    runs-on: ubuntu-latest
    steps:
      - name: Close sync failure alert after recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[自动监控] 衍生仓库同步失败"
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "最新一次衍生仓库同步已成功，自动关闭此告警。"
            gh issue close "$issue"
          fi
